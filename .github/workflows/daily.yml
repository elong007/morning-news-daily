name: 每日晨报

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00。GitHub 定时任务高峰期可能延迟若干分钟。
    - cron: "0 0 * * *"
  workflow_dispatch:        # 允许手动触发（测试用）
    inputs:
      dry_run:
        description: "只生成口播稿并归档，不推 Telegram（重跑不刷屏）"
        type: boolean
        default: false

permissions:
  contents: write           # 需要把 archive/ 回写仓库

jobs:
  morning-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install edge-tts requests

      - name: 生成并推送晨报
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 克隆音色（选填，缺失则自动回落 Edge TTS）
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          # 口播音色和语速。想换声音去 Settings → Secrets and variables → Actions
          # → Variables 里改 TTS_VOICE / TTS_RATE，不用动代码。没设就用这里的默认值。
          TTS_VOICE: ${{ vars.TTS_VOICE || 'zh-CN-YunjianNeural' }}
          TTS_RATE: ${{ vars.TTS_RATE || '+8%' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python morning_news.py

      - name: 归档口播稿
        run: |
          if [ -z "$(git status --porcelain archive)" ]; then
            echo "archive 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "归档口播稿 $(date -u -d '+8 hours' +%F)"
          git push
