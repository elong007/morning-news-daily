name: 每日晨报

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00。GitHub 定时任务高峰期可能延迟若干分钟。
    - cron: "0 0 * * *"
  workflow_dispatch:        # 允许手动触发（测试用）

jobs:
  morning-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install edge-tts requests

      - name: 生成并推送晨报
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 克隆音色（选填，缺失则自动回落 Edge TTS）
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
        run: python morning_news.py
